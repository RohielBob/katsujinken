<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fff6e5"/>
  <!-- bassine -->
  <path d="M40 150 L60 270 H340 L360 150Z" fill="#9ad7ff" stroke="#14112b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M48 168 Q90 160 130 168 T210 168 T290 168 T352 168" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <!-- maquette à coque rectangulaire, inclinée -->
  <g transform="rotate(-9 200 160)">
    <rect x="120" y="128" width="160" height="56" rx="4" fill="#ff6b4a" stroke="#14112b" stroke-width="4"/>
    <rect x="150" y="110" width="22" height="18" rx="2" fill="#5b2bff" stroke="#14112b" stroke-width="3"/>
    <rect x="178" y="104" width="22" height="24" rx="2" fill="#ffc83d" stroke="#14112b" stroke-width="3"/>
    <rect x="206" y="112" width="22" height="16" rx="2" fill="#c8ff3d" stroke="#14112b" stroke-width="3"/>
    <!-- points G, B, M -->
    <line x1="200" y1="60" x2="200" y2="176" stroke="#14112b" stroke-width="2.5" stroke-dasharray="6 6"/>
    <circle cx="200" cy="70" r="7" fill="#5b2bff" stroke="#14112b" stroke-width="3"/>
    <circle cx="200" cy="146" r="7" fill="#14112b"/>
    <circle cx="200" cy="168" r="7" fill="#fff" stroke="#14112b" stroke-width="3"/>
  </g>
  <text x="214" y="64" font-family="Arial Black, sans-serif" font-size="18" fill="#14112b">M</text>
  <text x="168" y="160" font-family="Arial Black, sans-serif" font-size="18" fill="#14112b">G</text>
  <text x="222" y="190" font-family="Arial Black, sans-serif" font-size="18" fill="#14112b">B</text>
  <!-- téléphone qui mesure l'angle (phyphox) -->
  <g transform="rotate(8 330 70)">
    <rect x="300" y="24" width="56" height="96" rx="10" fill="#14112b"/>
    <rect x="306" y="34" width="44" height="74" rx="4" fill="#c8ff3d"/>
    <text x="328" y="78" font-family="Arial Black, sans-serif" font-size="17" text-anchor="middle" fill="#14112b">9°</text>
  </g>
  <path d="M60 70 Q 110 40 150 92" fill="none" stroke="#14112b" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 92 l-14 -4 M150 92 l-2 -14" stroke="#14112b" stroke-width="3" stroke-linecap="round"/>
  <text x="24" y="62" font-family="Arial Black, sans-serif" font-size="16" fill="#14112b">GM &gt; 0 ?</text>
</svg>
